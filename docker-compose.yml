# Стенд одним сервисом: make up → http://localhost:8100
#
# Порт хоста 8100 выбран по карте соседей OrbStack: cdm держит 80,
# melgis — 8080/8081/5435, а 8000 оставлен оффлайн-режиму (python http.server).
# Переопределяется окружением: VTT_PORT=9000 make up.
# Имена и том свои (vtt-*) — с соседями не пересекаются.

services:
  vtt:
    build: .
    container_name: vtt-stand
    ports:
      - "${VTT_PORT:-8100}:8000"
    volumes:
      - vtt_data:/data
    restart: unless-stopped

volumes:
  vtt_data:
