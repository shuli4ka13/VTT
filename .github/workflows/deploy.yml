name: Проверки и выкатка стенда

on:
  push:
    branches: [cdm]
  workflow_dispatch:

concurrency:
  group: vtt-stand
  cancel-in-progress: false

jobs:
  checks:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: schema
        run: npx vitest run --reporter=dot
        working-directory: packages/schema
      - name: engine
        run: npx vitest run --reporter=dot
        working-directory: packages/engine
      - name: server
        run: npx vitest run --reporter=dot
        working-directory: apps/server
      - name: web
        run: npx vitest run --reporter=dot
        working-directory: apps/web

  image:
    name: Образ
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкатка на стенд
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Выкатка
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          IMAGE: ${{ needs.image.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh "$TARGET" "DOCKER_CONFIG=/opt/vtt/.docker docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$TARGET" sh -s -- "$IMAGE" < deploy/remote-deploy.sh
          ssh "$TARGET" "DOCKER_CONFIG=/opt/vtt/.docker docker logout ghcr.io"
