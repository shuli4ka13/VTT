<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор систем — хаб документов</title>
<style>
:root{
  --bg:#0f1117; --card:#1a1d2e; --card2:#1e2336; --line:#2a3050; --line2:#363b5e;
  --txt:#e4e9f5; --mut:#8a96b4;
  --ind:#818cf8; --teal:#34d399; --purp:#c084fc; --orng:#fb923c; --blue:#60a5fa; --yel:#fbbf24; --red:#f87171; --green:#4ade80; --cp:#22d3ee; --mag:#f472b6;
  --hf:'Georgia','Times New Roman',serif; --bf:'Segoe UI',system-ui,sans-serif; --mono:'Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--bf);font-size:13px;display:flex;height:100vh;overflow:hidden}

/* sidebar */
.side{width:290px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line2);display:flex;flex-direction:column;height:100vh}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.brand .eyebrow{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--ind)}
.brand h1{font-family:var(--hf);font-size:19px;font-weight:700;margin-top:3px;line-height:1.15}
.brand .cnt{font-size:10.5px;color:var(--mut);margin-top:4px}
.nav{overflow-y:auto;flex:1;padding:8px 8px 24px}
.grp{margin-top:12px}
.grp .gt{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);padding:6px 10px 5px;display:flex;align-items:center;gap:6px}
.item{display:block;padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--card2)}
.item.on{background:rgba(129,140,248,.12);border-color:var(--ind)}
.item .nm{font-weight:600;font-size:12.5px;color:var(--txt);display:flex;align-items:center;gap:7px}
.item .nm .st{margin-left:auto;font-size:10px;color:var(--yel)}
.item .ds{font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.35;padding-left:20px}
.item.on .nm{color:var(--ind)}

/* main */
.main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--card);border-bottom:1px solid var(--line2);flex-shrink:0}
.topbar .cur{font-family:var(--hf);font-size:15px;font-weight:700}
.topbar .curd{font-size:11.5px;color:var(--mut)}
.topbar .sp{flex:1}
.topbar a.ext{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid var(--line2);border-radius:7px;padding:6px 11px;background:var(--card2)}
.topbar a.ext:hover{color:var(--ind);border-color:var(--ind)}
.stage{flex:1;position:relative;min-height:0;background:var(--bg)}
iframe{width:100%;height:100%;border:none;display:block;background:var(--bg)}

/* home */
.home{position:absolute;inset:0;overflow-y:auto;padding:30px 34px}
.home.hidden{display:none}
.home .he{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ind)}
.home h2{font-family:var(--hf);font-size:26px;font-weight:700;margin-top:6px}
.home p{font-size:13.5px;color:var(--mut);line-height:1.55;max-width:80ch;margin-top:8px}
.flow{display:flex;flex-wrap:wrap;gap:9px;align-items:stretch;margin:22px 0}
.fstep{background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:12px 14px;flex:1;min-width:150px;cursor:pointer;border-top:3px solid var(--ac)}
.fstep:hover{background:var(--card2)}
.fstep .fn{font-family:var(--mono);font-size:10px;color:var(--ac);font-weight:700}
.fstep .ft{font-weight:700;font-size:13.5px;margin-top:3px}
.fstep .fd{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:8px}
.hcard{background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:13px;cursor:pointer}
.hcard:hover{border-color:var(--ind);background:var(--card2)}
.hcard .hn{font-weight:700;font-size:13px;display:flex;gap:7px;align-items:center}
.hcard .hd{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.4}
.hsec{font-family:var(--hf);font-size:16px;font-weight:700;margin:22px 0 4px;color:var(--txt)}

@media(max-width:760px){
  body{flex-direction:column;overflow:auto;height:auto}
  .side{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line2)}
  .nav{max-height:none}
  .main{height:auto}
  .stage{height:80vh}
}
</style>
</head>
<body>
<div class="side">
  <div class="brand" onclick="goHome()">
    <div class="eyebrow">TTRPG · рабочее пространство</div>
    <h1>Конструктор систем</h1>
    <div class="cnt" id="cnt"></div>
  </div>
  <div class="nav" id="nav"></div>
</div>
<div class="main">
  <div class="topbar">
    <div><div class="cur" id="curName">Обзор</div><div class="curd" id="curDesc">карта всех документов и порядок работы</div></div>
    <span class="sp"></span>
    <a class="ext" id="extLink" href="#" target="_blank" style="display:none">↗ открыть отдельно</a>
  </div>
  <div class="stage">
    <div class="home" id="home"></div>
    <iframe id="frame" title="документ" style="display:none"></iframe>
  </div>
</div>

<script>
const GROUPS=[
 {gt:'🧩 Приложения (рабочие)',items:[
   {f:'system-constructor/index.html',nm:'Конструктор систем',d:'основной инструмент (эталон-сборка)',ico:'🛠️'},
   {f:'combat-screen/index.html',nm:'Боевой экран (VTT)',d:'мобильная карта, токены, шаблоны',ico:'🗺️'},
   {f:'charnik-cyberpunk-red.html',nm:'Чарник Cyberpunk RED',d:'полный лист со всем',ico:'🧑'},
 ]},
 {gt:'📖 Каталоги механик (из рулбуков)',items:[
   {f:'dnd2024-mehaniki.html',nm:'Механики D&D 2024',d:'весь рулбук по движковым блокам',ico:'🎲'},
   {f:'cyberpunk-mehaniki.html',nm:'Механики Cyberpunk RED',d:'то же для панка',ico:'🌆'},
   {f:'mehaniki-modifikatory.html',nm:'Модификаторы броска',d:'преимущество и весь класс (6 механизмов)',ico:'➕'},
   {f:'vse-formuly-shemy.html',nm:'Все формулы схемами',d:'блок-схемы + глоссарий',ico:'📐'},
   {f:'dnd-formuly.html',nm:'Формулы D&D',d:'справочник формул',ico:'📊'},
   {f:'cyberpunk-formuly.html',nm:'Формулы Cyberpunk',d:'справочник формул',ico:'📊'},
 ]},
 {gt:'🔀 Матрицы',items:[
   {f:'mehaniki-sravnenie.html',nm:'Сравнение + что нужно для VTT',d:'D&D×CP бок о бок, редактируемая',ico:'⭐',star:1},
   {f:'matrica-realizacii.html',nm:'Матрица реализации',d:'что построить, готовность систем',ico:'✅'},
   {f:'mehaniki-pokrytie.html',nm:'Матрица покрытия',d:'какие механики нужны каждой',ico:'🗂️'},
   {f:'matrica-trassirovki.html',nm:'Трассировка требований',d:'функционал × статус',ico:'📋'},
 ]},
 {gt:'🧰 Инструментарий и план',items:[
   {f:'instrumentarij.html',nm:'Инструментарий',d:'палитра редакторов конструктора',ico:'🧰'},
   {f:'dorozhnaya-karta.html',nm:'Дорожная карта',d:'что кодить и в каком порядке',ico:'🗺️'},
   {f:'konfigurator-sistemy.html',nm:'Конфигуратор системы',d:'что нужно, чтобы система работала',ico:'⚙️'},
 ]},
 {gt:'🎛️ Контролы и демо',items:[
   {f:'kontroly.html',nm:'Палитра контролов',d:'12 умных кнопок листа (живые)',ico:'🎛️'},
   {f:'demo-vladenie.html',nm:'Демо: кружок владения',d:'бонус мастерства как в Foundry',ico:'⭕'},
 ]},
 {gt:'⚔️ Эффекты и бой',items:[
   {f:'effekty-model.html',nm:'Модель эффектов (D&D)',d:'триггер × длительность, авто-протяжка',ico:'⚡'},
   {f:'effekty-cyberpunk.html',nm:'Эффекты Cyberpunk',d:'то же для панка',ico:'⚡'},
   {f:'ataka-shema.html',nm:'Схема атаки',d:'блок-схема с развилкой брони',ico:'🎯'},
   {f:'avtomatizaciya-ataki.html',nm:'Пайплайн атаки',d:'линейная автоматизация',ico:'🔗'},
 ]},
 {gt:'💡 Концепты (ранние)',items:[
   {f:'konstruktor-arhitektura.html',nm:'Архитектура конструктора',d:'общая схема',ico:'🏛️'},
   {f:'konstruktor-kak-vyglyadit.html',nm:'Как выглядит конструктор',d:'вид интерфейса',ico:'🖼️'},
   {f:'koncept-compendium.html',nm:'Концепт компендиума',d:'сущности и поля',ico:'📚'},
   {f:'compendium-vidy.html',nm:'Виды компендиума',d:'6 представлений',ico:'👁️'},
   {f:'proc-charnik-sborka.html',nm:'Процедурная сборка чарника',d:'шаг за шагом',ico:'🧱'},
   {f:'proc-charnik.html',nm:'Процедурный чарник',d:'каскадный пересчёт',ico:'🔧'},
 ]},
];
// flow steps (curated pipeline) → link to key docs
const FLOW=[
 {ac:'--teal',fn:'01',ft:'Разбор систем',fd:'механики D&D и Cyberpunk из рулбуков',f:'dnd2024-mehaniki.html'},
 {ac:'--blue',fn:'02',ft:'Сведение',fd:'сравнение + что нужно для VTT',f:'mehaniki-sravnenie.html'},
 {ac:'--purp',fn:'03',ft:'Инструментарий',fd:'какие редакторы построить',f:'instrumentarij.html'},
 {ac:'--orng',fn:'04',ft:'План',fd:'дорожная карта по фазам',f:'dorozhnaya-karta.html'},
 {ac:'--ind',fn:'05',ft:'Под систему',fd:'конфигуратор требований',f:'konfigurator-sistemy.html'},
 {ac:'--mag',fn:'06',ft:'Контролы',fd:'умные кнопки листа',f:'kontroly.html'},
];
const ALL={};GROUPS.forEach(g=>g.items.forEach(i=>ALL[i.f]=i));
let total=Object.keys(ALL).length;
document.getElementById('cnt').textContent=total+' документов · клик по названию — открыть здесь';

// build nav
let nh='';
GROUPS.forEach(g=>{
  nh+=`<div class="grp"><div class="gt">${g.gt}</div>`;
  g.items.forEach(i=>{
    nh+=`<div class="item" data-f="${i.f}" onclick="open_('${i.f}')"><div class="nm">${i.ico||'📄'} ${i.nm}${i.star?'<span class="st">★</span>':''}</div><div class="ds">${i.d}</div></div>`;
  });
  nh+='</div>';
});
document.getElementById('nav').innerHTML=nh;

// build home
let hh=`<div class="he">рабочее пространство</div><h2>Конструктор TTRPG-систем: все документы</h2>
<p>Здесь собрано всё по проекту — от разбора механик D&amp;D и Cyberpunk из рулбуков до плана разработки конструктора. Слева меню; клик открывает документ прямо тут. Ниже — рекомендованный маршрут и полный список.</p>
<div class="flow">`;
FLOW.forEach(s=>{hh+=`<div class="fstep" style="--ac:var(${s.ac})" onclick="open_('${s.f}')"><div class="fn">${s.fn}</div><div class="ft">${s.ft}</div><div class="fd">${s.fd}</div></div>`;});
hh+='</div>';
GROUPS.forEach(g=>{
  hh+=`<div class="hsec">${g.gt}</div><div class="grid2">`;
  g.items.forEach(i=>{hh+=`<div class="hcard" onclick="open_('${i.f}')"><div class="hn">${i.ico||'📄'} ${i.nm}${i.star?' ★':''}</div><div class="hd">${i.d}</div></div>`;});
  hh+='</div>';
});
document.getElementById('home').innerHTML=hh;

const frame=document.getElementById('frame'),home=document.getElementById('home');
function open_(f){
  const it=ALL[f];if(!it)return goHome();
  frame.src=f;frame.style.display='block';home.classList.add('hidden');
  document.getElementById('curName').textContent=it.nm;
  document.getElementById('curDesc').textContent=it.d;
  const ext=document.getElementById('extLink');ext.href=f;ext.style.display='inline-block';
  document.querySelectorAll('.item').forEach(x=>x.classList.toggle('on',x.dataset.f===f));
  try{localStorage.setItem('hub-last',f);}catch(_){}
  if(location.hash.slice(1)!==f)history.replaceState(null,'','#'+f);
}
function goHome(){
  frame.style.display='none';frame.src='about:blank';home.classList.remove('hidden');
  document.getElementById('curName').textContent='Обзор';
  document.getElementById('curDesc').textContent='карта всех документов и порядок работы';
  document.getElementById('extLink').style.display='none';
  document.querySelectorAll('.item').forEach(x=>x.classList.remove('on'));
  try{localStorage.removeItem('hub-last');}catch(_){}
  history.replaceState(null,'','#');
}
// init: hash > last > home
const hf=decodeURIComponent(location.hash.slice(1));
if(hf&&ALL[hf])open_(hf);
else{let last=null;try{last=localStorage.getItem('hub-last');}catch(_){}if(last&&ALL[last])open_(last);else goHome();}
window.addEventListener('hashchange',()=>{const f=decodeURIComponent(location.hash.slice(1));if(f&&ALL[f])open_(f);else if(!f)goHome();});
</script>
</body>
</html>
